name: Merge China Domain Rules
run-name: "ChinaDomain fresh build #${{ github.run_number }} (${{ github.event_name }})"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/merge-china-domain.yml"
      - "scripts/publish_generated.py"
      - "scripts/validate_generated.py"
      - "scripts/build_china_domain.py"
      - "scripts/audit_rule_coverage.py"
      - "data/sources/ChinaDomainList_URLs.txt"
      - "data/sources/ChinaSupplement_URLs.txt"
      - "data/sources/ChinaForeignDomain_URLs.txt"
      - "data/sources/ChinaForeignIP_URLs.txt"
      - "data/allowlists/ChinaForeignDomains.list"
      - "data/allowlists/ChinaForeignIPs.list"
      - "scripts/fetch_rule_sources.py"
      - "tests/test_rule_pipeline.py"
  schedule:
    # 04:20 Asia/Shanghai (UTC+8) every day
    - cron: "20 20 * * *"

permissions:
  contents: write

concurrency:
  group: net-link-china-domain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run China and Adblock safety regressions
        run: python3 -m unittest discover -s tests -p "test_rule_pipeline.py" -v

      - name: Download all China and foreign-validation inputs (fresh)
        run: python -u scripts/fetch_rule_sources.py china

      - name: Build ChinaDomain list ONLY from this run snapshots
        run: python -u scripts/build_china_domain.py --offline

      - name: Archive raw upstream snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: china-upstream-snapshots
          path: |
            data/china/upstream/
            data/reports/china_source_integrity.json
            data/reports/china_download_manifest.json
            data/reports/china_risk_audit.json
            data/reports/china_supplement_audit.json
          retention-days: 7
          if-no-files-found: warn

      - name: Validate generated outputs
        run: python3 scripts/validate_generated.py china

      - name: Full China and Adblock rule audit
        run: python3 scripts/audit_rule_coverage.py

      - name: Publish
        run: |
          python3 scripts/publish_generated.py "chore: update china domain rules" \
            Surge/Rules/ChinaDomain.list \
            Clash/Rules/ChinaDomain.yaml \
            data/china/upstream/ \
            data/reports/china_download_manifest.json \
            data/reports/china_source_integrity.json \
            data/reports/china_risk_audit.json \
            data/reports/china_supplement_audit.json \
            data/reports/rule_coverage_audit.json \
            data/reports/rule_coverage_overlaps.csv

      - name: Verify that raw inputs reached the main branch
        run: |
          git fetch origin main
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          manifest = json.loads(Path("data/reports/china_download_manifest.json").read_text(encoding="utf-8"))
          sources = manifest["sources"]
          expected = {entry["path"] for entry in sources}
          remote_paths = set(subprocess.check_output(
              ["git", "ls-tree", "-r", "--name-only", "origin/main", "--", "data/china/upstream/"],
              text=True,
          ).splitlines())
          if remote_paths != expected:
              raise SystemExit(f"Published raw sources mismatch: remote={len(remote_paths)} expected={len(expected)}")

          for path in sorted(expected):
              local_sha = subprocess.check_output(["git", "hash-object", path], text=True).strip()
              remote_sha = subprocess.check_output(["git", "rev-parse", "origin/main:" + path], text=True).strip()
              if local_sha != remote_sha:
                  raise SystemExit(f"Published source bytes differ: {path}")
          for name in (
              "Surge/Rules/ChinaDomain.list", "Clash/Rules/ChinaDomain.yaml",
              "data/reports/china_source_integrity.json",
              "data/reports/china_download_manifest.json",
              "data/reports/china_risk_audit.json",
              "data/reports/china_supplement_audit.json",
          ):
              local_sha = subprocess.check_output(["git", "hash-object", name], text=True).strip()
              remote_sha = subprocess.check_output(["git", "rev-parse", "origin/main:" + name], text=True).strip()
              if local_sha != remote_sha:
                  raise SystemExit(f"Published China result differs from freshly generated file: {name}")
          print(f"Confirmed {len(expected)} fresh inputs and published China output files on origin/main")
          PY

      - name: Summarize fresh China rebuild with verifiable output hashes
        if: success()
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path(".")
          m = json.loads((root / "data/reports/china_download_manifest.json").read_text(encoding="utf-8"))
          integrity = json.loads((root / "data/reports/china_source_integrity.json").read_text(encoding="utf-8"))
          risk = json.loads((root / "data/reports/china_risk_audit.json").read_text(encoding="utf-8"))
          supplemental = json.loads((root / "data/reports/china_supplement_audit.json").read_text(encoding="utf-8"))
          source_file = root / "Surge/Rules/ChinaDomain.list"
          current_blob = subprocess.check_output(["git", "hash-object", str(source_file)], text=True).strip()
          previous_blob = subprocess.check_output(
              ["git", "rev-parse", os.environ["GITHUB_SHA"] + ":Surge/Rules/ChinaDomain.list"],
              text=True,
          ).strip()
          updated = current_blob != previous_blob
          run_url = os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"]
          summary = "\n".join([
              "# ChinaDomain — complete fresh-source build",
              "",
              f"- [GitHub Actions run]({run_url}) · attempt `{os.environ.get('GITHUB_RUN_ATTEMPT', '1')}`",
              f"- Source fetch time (UTC): **{m['fetched_at_utc']}**",
              f"- Downloaded sources: **{m['downloaded_count']}/{m['source_count']}**",
              f"- Verified final rules: **{integrity['published_rule_count']:,}**",
              f"- Published Surge output SHA-256: `{hashlib.sha256(source_file.read_bytes()).hexdigest()}`",
              f"- Actual rules payload changed vs checkout: **{'YES' if updated else 'NO (unchanged source-normalized content)'}**",
              f"- Excluded documented foreign domain rules: **{risk['foreign_domain_rules_excluded']}**",
              f"- Additional CN source files audited: **{len(supplemental['sources'])}**",
              f"- CN-verified candidate supplement rules: **{supplemental['accepted_unique_rule_count']}**",
              "",
              "Unchanged rules intentionally retain their previous Git modification time. The fresh download manifest and this run remain new and independently verifiable.",
              "",
              "[Downloaded source manifest](https://github.com/master-zen/Net-Link/blob/main/data/reports/china_download_manifest.json) · [Final ChinaDomain.list](https://github.com/master-zen/Net-Link/blob/main/Surge/Rules/ChinaDomain.list)",
          ]) + "\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(summary)
          print(summary)
          PY
