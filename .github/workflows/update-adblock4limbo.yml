name: Update Adblock4limbo Ads Only

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-adblock4limbo.yml"
      - "Surge/Module/.generator/update-adblock4limbo.py"
      - "scripts/publish_generated.py"
      - "scripts/validate_generated.py"
  schedule:
    - cron: "41 20 * * *"

permissions:
  contents: write

concurrency:
  group: net-link-adblock4limbo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate
        run: python3 Surge/Module/.generator/update-adblock4limbo.py

      - name: Verify JavaScript
        run: |
          node --check Surge/Module/runtime/Adblock4limbo.js
          node --check Surge/Module/runtime/Adblock4limbo.user.js

      - name: Validate generated outputs
        run: python3 scripts/validate_generated.py adblock

      - name: Publish
        run: |
          python3 scripts/publish_generated.py "chore: update Adblock4limbo ads-only" \
            Surge/Module/Adblock4limbo.sgmodule \
            Surge/Module/runtime/Adblock4limbo.js \
            Surge/Module/runtime/Adblock4limbo.user.js
