name: Build Surge Icon JSON

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/merge-surge-icons.yml"
      - "scripts/publish_generated.py"
      - "scripts/validate_generated.py"
  schedule:
    # 05:10 Asia/Shanghai (UTC+8), every 2 days
    - cron: "10 21 */2 * *"

permissions:
  contents: write

concurrency:
  group: net-link-surge-icons-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build Surge Icon.json
        run: python scripts/build_icon_json.py

      - name: Validate generated outputs
        run: python3 scripts/validate_generated.py icons

      - name: Publish
        run: |
          python3 scripts/publish_generated.py "chore: update surge icon index" \
            Surge/Icon.json
