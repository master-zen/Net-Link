name: Update App Start Up AD Blacklist

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/sources/AppStartUpADBlacklist.json"
      - "scripts/build_app_startup_ad.py"
      - "Surge/Module/runtime/app-startup-ad.js"
      - ".github/workflows/update-app-startup-ad.yml"
  schedule:
    - cron: "23 20 * * *"

permissions:
  contents: write

concurrency:
  group: net-link-app-startup-ad
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/build_app_startup_ad.py --audit startup-source-audit.json
      - run: python -m unittest discover -s tests -p "test_app_startup_ad.py"
      - run: node tests/test_app_startup_ad.js
      - run: python scripts/validate_generated.py startup
      - uses: actions/upload-artifact@v4
        with:
          name: startup-source-audit
          path: startup-source-audit.json
      - run: |
          python scripts/publish_generated.py "chore: update App Start Up AD Blacklist" Surge/Module/AppStartUpADBlacklist.sgmodule
