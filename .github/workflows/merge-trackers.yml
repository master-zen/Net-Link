name: Merge Trackers Rules

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/merge-trackers.yml"
      - "scripts/publish_generated.py"
      - "scripts/validate_generated.py"
  schedule:
    # 04:40 Asia/Shanghai (UTC+8) every day
    - cron: "40 20 * * *"

permissions:
  contents: write

concurrency:
  group: net-link-trackers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build trackers outputs
        run: python scripts/build_trackers.py

      - name: Validate generated outputs
        run: python3 scripts/validate_generated.py trackers

      - name: Publish
        run: |
          python3 scripts/publish_generated.py "chore: update trackers rules" \
            Clash/Rules/Trackers.yaml \
            Surge/Rules/Trackers.list \
            Trackers/Trackers.txt
