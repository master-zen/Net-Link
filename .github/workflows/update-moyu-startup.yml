name: Update Moyu StartUpAds

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-moyu-startup.yml"
      - "scripts/publish_generated.py"
      - "scripts/validate_generated.py"

  schedule:
    # UTC 20:23 = 北京时间次日 04:23
    - cron: "23 20 * * *"

permissions:
  contents: write

concurrency:
  group: net-link-moyu-startup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build Moyu StartUpAds Surge Module
        env:
          RUNTIME_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/Surge/Module
          OUTPUT_FILE: ${{ github.workspace }}/Surge/Module/StartUpAds.sgmodule
        run: |
          python3 Surge/Module/.generator/build.py

      - name: Safety Check
        run: |
          set -e

          test -s Surge/Module/StartUpAds.sgmodule

          if grep -E '(_|-)[[:space:]]*reject-(200|img|dict|array)' \
            Surge/Module/StartUpAds.sgmodule
          then
            echo "ERROR: 非法 Surge reject-* 配置"
            exit 1
          fi

          if grep -F 'max-size=-1' Surge/Module/StartUpAds.sgmodule
          then
            echo "ERROR: 检测到 max-size=-1"
            exit 1
          fi

          if grep -F 'timeout=60' Surge/Module/StartUpAds.sgmodule
          then
            echo "ERROR: 检测到 timeout=60"
            exit 1
          fi

          echo "Safety check OK"

      - name: Validate generated outputs
        run: python3 scripts/validate_generated.py moyu

      - name: Publish
        run: |
          python3 scripts/publish_generated.py "chore: update Moyu StartUpAds" \
            Surge/Module/StartUpAds.sgmodule \
            Surge/Module/upstream/
