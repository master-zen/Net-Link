name: Update SuperAdBlock

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-super-adblock.yml"
      - "scripts/super_adblock.py"
      - "scripts/super_adblock_scripts.py"
      - "scripts/super_adblock_ast.cjs"
      - "scripts/publish_generated.py"
      - "tests/test_super_adblock.py"
      - "tests/super_adblock_ast_check.cjs"
      - "data/sources/SuperAdBlock*"
      - "data/allowlists/AdblockCriticalAllow.list"
      - "Surge/Module/.generator/safety.py"
  schedule:
    - cron: "43 21 * * *"

permissions:
  contents: read

concurrency:
  group: net-link-super-adblock
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_PATH: /usr/share/nodejs
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p test_super_adblock.py -v
      - id: fetch
        run: python scripts/super_adblock.py fetch "$RUNNER_TEMP/super-adblock"
      - id: scanner
        if: always() && steps.fetch.outcome != 'skipped'
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clamav node-acorn
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
          node -e "require('acorn')"
          node tests/super_adblock_ast_check.cjs
      - if: always() && steps.fetch.outcome != 'skipped'
        env:
          SUPER_ADBLOCK_ANTIVIRUS_READY: ${{ steps.scanner.outcome == 'success' }}
        run: python scripts/super_adblock_scripts.py "$RUNNER_TEMP/super-adblock"
      - run: python scripts/super_adblock.py review "$RUNNER_TEMP/super-adblock"
      - run: python scripts/super_adblock.py review-validate "$RUNNER_TEMP/super-adblock"
      - run: python scripts/super_adblock.py build "$RUNNER_TEMP/super-adblock"
      - run: python scripts/super_adblock.py validate "$RUNNER_TEMP/super-adblock"
      - if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          base=Path(os.environ["RUNNER_TEMP"])/"super-adblock"
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              for name, keys in [("manifest.json",("downloaded","failed")),("review-audit.json",("sources","downloaded","failed","alternative_coverage","output")),("script-audit.json",("references","antivirus_ready"))]:
                  path=base/name
                  if path.exists():
                      data=json.loads(path.read_text())
                      out.write("### "+name+"\n\n")
                      for key in keys:
                          if key in data:
                              out.write("- "+key+": "+str(data[key])+"\n")
                      if name=="script-audit.json":
                          from collections import Counter
                          out.write("- decisions: "+str(dict(Counter(e["decision"] for e in data["entries"])))+"\n")
                      out.write("\n")
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: super-adblock-review
          retention-days: 7
          path: |
            ${{ runner.temp }}/super-adblock/manifest.json
            ${{ runner.temp }}/super-adblock/audit.json
            ${{ runner.temp }}/super-adblock/review-audit.json
            ${{ runner.temp }}/super-adblock/script-audit.json
      - id: gate
        run: echo "approved=$(python scripts/super_adblock.py approved "$RUNNER_TEMP/super-adblock")" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.approved == 'true'
        run: python scripts/super_adblock.py stage "$RUNNER_TEMP/super-adblock"
      - if: steps.gate.outputs.approved == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: super-adblock-approved
          retention-days: 1
          path: |
            data/super-adblock/upstream/
            data/reports/super_adblock_download_manifest.json
            data/reports/super_adblock_audit.json
            Surge/Module/SuperAdBlock.sgmodule
            data/reports/super_adblock_script_audit.json
            Surge/Scripts/Converted/SuperAdBlock/
    outputs:
      approved: ${{ steps.gate.outputs.approved }}
  publish:
    needs: build
    if: needs.build.outputs.approved == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: super-adblock-approved
          path: .
      - run: |
          test -f data/reports/super_adblock_audit.json
          python -c 'import json; a=json.load(open("data/reports/super_adblock_audit.json")); m=json.load(open("data/reports/super_adblock_download_manifest.json")); assert not a["review_only"] and not m["failed"]'
          python scripts/publish_generated.py "chore: update SuperAdBlock" data/super-adblock/upstream/ data/reports/super_adblock_download_manifest.json data/reports/super_adblock_audit.json data/reports/super_adblock_script_audit.json Surge/Module/SuperAdBlock.sgmodule Surge/Scripts/Converted/SuperAdBlock/
          git fetch origin main
          git diff --exit-code HEAD origin/main -- data/super-adblock/upstream/ data/reports/super_adblock_download_manifest.json data/reports/super_adblock_audit.json data/reports/super_adblock_script_audit.json Surge/Module/SuperAdBlock.sgmodule Surge/Scripts/Converted/SuperAdBlock/
