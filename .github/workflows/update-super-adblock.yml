name: Update SuperAdBlock

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-super-adblock.yml"
      - "scripts/super_adblock.py"
      - "scripts/super_adblock_cache.py"
      - "scripts/super_adblock_regression.py"
      - "scripts/super_adblock_quality.py"
      - "scripts/super_adblock_cross.py"
      - "scripts/super_adblock_discover.py"
      - "scripts/super_adblock_scripts.py"
      - "scripts/super_adblock_ast.cjs"
      - "scripts/super_adblock_protobuf.cjs"
      - "tests/super_adblock_protobuf_check.cjs"
      - "scripts/publish_generated.py"
      - "tests/test_super_adblock.py"
      - "tests/super_adblock_ast_check.cjs"
      - "data/sources/SuperAdBlock*"
      - "data/allowlists/AdblockCriticalAllow.list"
      - "Surge/Module/.generator/safety.py"
  schedule:
    - cron: "43 21 * * *"

permissions:
  contents: read

concurrency:
  group: net-link-super-adblock
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      NODE_PATH: /usr/share/nodejs
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p test_super_adblock.py -v
      - name: Verify experimental binary response profile
        run: node tests/super_adblock_protobuf_check.cjs
      - id: fetch
        run: python scripts/super_adblock.py fetch "$RUNNER_TEMP/super-adblock"
      - name: Discover upstream candidates and license metadata
        continue-on-error: true
        env:
          SUPER_ADBLOCK_DISCOVERY_TOKEN: ${{ github.token }}
        run: python scripts/super_adblock_discover.py "$RUNNER_TEMP/super-adblock"
      - id: scanner
        if: always() && steps.fetch.outcome != 'skipped'
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clamav node-acorn jq
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam --stdout
          node -e "require('acorn')"
          node tests/super_adblock_ast_check.cjs
          jq --version
          python -c 'import sys; sys.path.insert(0,"scripts"); import super_adblock as s, subprocess, json; data={"ads":[1],"data":{"adInfo":[2],"title":"keep"},"user":{"id":1}}; result=subprocess.check_output(["jq","-c",s.body_expression({("ads",),("data","adInfo")})],input=json.dumps(data),text=True); assert json.loads(result)=={"data":{"title":"keep"},"user":{"id":1}}'
          python -c 'import sys; sys.path.insert(0,"scripts"); import super_adblock as s, subprocess, json; data={"list":[{"_type":"pic_ad"},{"_type":"post","title":"keep"},42,{"id":3}],"other":[1,2]}; result=subprocess.check_output(["jq","-c",s.body_expression(set(),{(("list",),"_type",json.dumps("pic_ad"))})],input=json.dumps(data),text=True); assert json.loads(result)=={"list":[{"_type":"post","title":"keep"},42,{"id":3}],"other":[1,2]}'
      - if: always() && steps.fetch.outcome != 'skipped'
        env:
          SUPER_ADBLOCK_ANTIVIRUS_READY: ${{ steps.scanner.outcome == 'success' }}
        run: python scripts/super_adblock_scripts.py "$RUNNER_TEMP/super-adblock"
      - run: python scripts/super_adblock.py review "$RUNNER_TEMP/super-adblock"
      - run: python scripts/super_adblock.py review-validate "$RUNNER_TEMP/super-adblock"
      - run: python scripts/super_adblock.py build "$RUNNER_TEMP/super-adblock"
      - run: python scripts/super_adblock.py validate "$RUNNER_TEMP/super-adblock"
      - name: Verify all generated jq responses preserve non-ad fixtures
        run: python scripts/super_adblock_regression.py "$RUNNER_TEMP/super-adblock"
      - name: Cross-module static conflict audit
        run: python scripts/super_adblock_cross.py "$RUNNER_TEMP/super-adblock"
      - id: quality
        run: python scripts/super_adblock_quality.py evaluate "$RUNNER_TEMP/super-adblock"
      - if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          base=Path(os.environ["RUNNER_TEMP"])/"super-adblock"
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              for name, keys in [("manifest.json",("downloaded","failed")),("review-audit.json",("sources","inventory_total","reference_only_count","reference_uncovered","downloaded","failed","alternative_coverage","failure_reasons","output")),("script-audit.json",("references","unique_downloaded_scripts","antivirus_ready"))]:
                  path=base/name
                  if path.exists():
                      data=json.loads(path.read_text())
                      out.write("### "+name+"\n\n")
                      for key in keys:
                          if key in data:
                              out.write("- "+key+": "+str(data[key])+"\n")
                              print(name,key,json.dumps(data[key],ensure_ascii=False,sort_keys=True))
                      if name=="script-audit.json":
                          from collections import Counter
                          decisions=dict(Counter(e["decision"] for e in data["entries"]))
                          out.write("- decisions: "+str(decisions)+"\n")
                          print(name,"decisions",json.dumps(decisions,sort_keys=True))
                      out.write("\n")
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: super-adblock-review
          retention-days: 7
          path: |
            ${{ runner.temp }}/super-adblock/manifest.json
            ${{ runner.temp }}/super-adblock/audit.json
            ${{ runner.temp }}/super-adblock/review-audit.json
            ${{ runner.temp }}/super-adblock/script-audit.json
            ${{ runner.temp }}/super-adblock/discovery.json
            ${{ runner.temp }}/super-adblock/quality.json
            ${{ runner.temp }}/super-adblock/cross-audit.json
            ${{ runner.temp }}/super-adblock/regression.json
      - if: always() && steps.quality.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: super-adblock-quality
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/super-adblock/quality.json
      - id: gate
        run: echo "approved=$(python scripts/super_adblock.py approved "$RUNNER_TEMP/super-adblock")" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.approved == 'true'
        run: python scripts/super_adblock.py stage "$RUNNER_TEMP/super-adblock"
      - if: steps.gate.outputs.approved == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: super-adblock-approved
          retention-days: 1
          path: |
            data/super-adblock/upstream/
            data/reports/super_adblock_download_manifest.json
            data/reports/super_adblock_audit.json
            Surge/Module/SuperAdBlock.sgmodule
            data/reports/super_adblock_script_audit.json
            data/reports/super_adblock_release_quality.json
            data/reports/super_adblock_cross_audit.json
            Surge/Scripts/Converted/SuperAdBlock/
    outputs:
      approved: ${{ steps.gate.outputs.approved }}
  quality-history:
    needs: build
    if: always() && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - id: quality-artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: super-adblock-quality
          path: ${{ runner.temp }}/super-adblock-quality
      - if: steps.quality-artifact.outcome == 'success'
        run: |
          python scripts/super_adblock_quality.py record "$RUNNER_TEMP/super-adblock-quality/quality.json"
          python scripts/publish_generated.py "chore: record SuperAdBlock quality" data/reports/super_adblock_quality_history.json
  publish:
    needs: build
    if: needs.build.outputs.approved == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: rm -rf data/super-adblock/upstream Surge/Scripts/Converted/SuperAdBlock
      - uses: actions/download-artifact@v4
        with:
          name: super-adblock-approved
          path: .
      - run: |
          python scripts/super_adblock.py verify-release "$RUNNER_TEMP/super-adblock-release"
          python scripts/publish_generated.py "chore: update SuperAdBlock" data/super-adblock/upstream/ data/reports/super_adblock_download_manifest.json data/reports/super_adblock_audit.json data/reports/super_adblock_script_audit.json data/reports/super_adblock_release_quality.json data/reports/super_adblock_cross_audit.json Surge/Module/SuperAdBlock.sgmodule Surge/Scripts/Converted/SuperAdBlock/
          git fetch origin main
          git diff --exit-code HEAD origin/main -- data/super-adblock/upstream/ data/reports/super_adblock_download_manifest.json data/reports/super_adblock_audit.json data/reports/super_adblock_script_audit.json data/reports/super_adblock_release_quality.json data/reports/super_adblock_cross_audit.json Surge/Module/SuperAdBlock.sgmodule Surge/Scripts/Converted/SuperAdBlock/
